import os
import asyncio
import discord
from discord.ext import commands

PREFIX = "!"

TOKENS = [
    os.getenv("BOT_TOKEN_1"),
    os.getenv("BOT_TOKEN_2"),
    os.getenv("BOT_TOKEN_3"),
    os.getenv("BOT_TOKEN_4"),
    os.getenv("BOT_TOKEN_5"),
]

bots = []

for number, token in enumerate(TOKENS, start=1):

    if not token:
        print(f"BOT_TOKEN_{number} missing")
        continue

    intents = discord.Intents.default()
    intents.message_content = True

    bot = commands.Bot(
        command_prefix=PREFIX,
        intents=intents
    )

    @bot.event
    async def on_ready():
        print(f"Bot {number} ONLINE: {bot.user}")

    @bot.command()
    async def ping(ctx):
        await ctx.send(f"🏓 Bot {number}: Pong!")

    bots.append((bot, token))


async def start_all():
    tasks = []

    for bot, token in bots:
        tasks.append(asyncio.create_task(bot.start(token)))

    await asyncio.gather(*tasks)


asyncio.run(start_all())
